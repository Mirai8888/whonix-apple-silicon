name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ubuntu provides Python 3.12, Bash and GNU coreutils. The tests use
      # disposable fixtures and stub VM/SSH commands; no VM images are needed.
      - name: Check Python syntax
        run: /usr/bin/python3 -m compileall -q scripts tests

      - name: Check shell syntax
        run: |
          for script in scripts/*; do
            [[ -f "$script" ]] || continue
            read -r shebang < "$script"
            case "$shebang" in
              '#!/bin/bash') bash -n "$script" ;;
              '#!/bin/sh') sh -n "$script" ;;
            esac
          done

      - name: Run fixture tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
